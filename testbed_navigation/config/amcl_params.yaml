
amcl:
  ros__parameters:
    use_sim_time: true

    # TF frames and laser topic
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 1.0

    # Differential-drive model for ROS 2 Humble
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Initial pose — verify against the actual spawn pose in map frame
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Motion model noise
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Laser model
    laser_model_type: likelihood_field
    laser_min_range: 0.1
    laser_max_range: -1.0
    laser_max_beams: 60
    laser_likelihood_max_dist: 2.0

    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1

    # Beam skipping
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # Update thresholds and recovery
    update_min_d: 0.25
    update_min_a: 0.2
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5
